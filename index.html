<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sergey's Running Log</title>
<meta name="description" content="Personal running log — race results, personal bests, and training activity stats for Sergey Filippovich.">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Sergey's Running Log">
<meta property="og:description" content="Race results, personal bests, and Garmin training stats — all in one place.">
<meta property="og:url" content="https://running-records-lac.vercel.app/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Sergey's Running Log">
<meta name="twitter:description" content="Race results, personal bests, and Garmin training stats — all in one place.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e8521b'/><text x='16' y='23' font-size='20' text-anchor='middle'>🏃</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #e8521b;
  --bg: #f0ede8;
  --card: #ffffff;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --border: #e5e1da;
  --shadow: 0 2px 16px rgba(0,0,0,0.07);
  --subtle: #f5f3ef;
}
:root.dark {
  --bg: #141414;
  --card: #1e1e1e;
  --text: #e8e4de;
  --muted: #999;
  --border: #2e2e2e;
  --shadow: 0 2px 16px rgba(0,0,0,0.4);
  --subtle: #252525;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── Header ── */
header {
  background: #1a1a1a;
  color: #fff;
  height: 60px;
  padding: 0 28px;
  display: flex;
  align-items: center;
  gap: 28px;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.logo {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.4px;
  white-space: nowrap;
}
.logo em { color: var(--accent); font-style: normal; }

nav { display: flex; gap: 4px; }

nav button {
  background: none;
  border: none;
  color: rgba(255,255,255,0.55);
  padding: 6px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.1px;
  transition: all 0.15s;
}
nav button:hover:not(.active) { background: rgba(255,255,255,0.08); color: #fff; }
nav button.active { background: var(--accent); color: #fff; }

/* ── Lang switcher ── */
.lang-switch {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 3px;
}
.lang-switch button {
  background: none;
  border: none;
  color: rgba(255,255,255,0.45);
  padding: 4px 11px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  transition: all 0.15s;
}
.lang-switch button:hover:not(.active) { color: #fff; }
.lang-switch button.active { background: var(--accent); color: #fff; }

/* ── Theme toggle ── */
#theme-toggle {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 4px 6px;
  color: rgba(255,255,255,0.7);
  transition: color 0.15s;
}
#theme-toggle:hover { color: #fff; }

#pbc-toggle {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 2px 4px;
  color: var(--muted);
  transition: color 0.15s;
}
#pbc-toggle:hover { color: var(--accent); }

/* ── Pages ── */
.page { display: none; max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }
.page.visible { display: block; }

/* ── Run card ── */
.run-card {
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  overflow: hidden;
}

/* Photo strip header */
.rc-strip {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2px;
  height: 210px;
  background: var(--subtle);
  /* no overflow:hidden — the medal badge deliberately overhangs the bottom.
     Photos cannot overflow anyway: they shrink to fit (flex 0 1 auto + min-width 0). */
}
.rc-strip img {
  /* fixed height + auto width = each photo keeps its own aspect ratio */
  height: 210px;
  width: auto;
  flex: 0 1 auto;
  min-width: 0;
  object-fit: contain;   /* safety net if a very wide photo has to shrink */
  display: block;
  cursor: pointer;
}
.rc-strip img.rc-medal {
  position: absolute;
  right: 18px;
  bottom: -26px;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--card);
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
  cursor: pointer;
  z-index: 2;
  transition: transform 0.15s;
}
.rc-strip img.rc-medal:hover { transform: scale(1.08); }

/* Card body */
.rc-body { padding: 18px 24px 14px; }
.rc-meta {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--muted);
}
.rc-titlerow {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-top: 5px;
}
.rc-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.05;
  min-width: 0;
}
.rc-dist {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -1.5px;
  color: var(--accent);
  line-height: 1;
  white-space: nowrap;
  flex-shrink: 0;
}
.rc-dist small {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0;
}

.run-card mark {
  background: #ffe066;
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
}
:root.dark .run-card mark { background: #b8860b; }

.run-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.run-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius: 20px;
  padding: 3px 10px 3px 6px;
}
/* Per-type pill color */
.run-tag-sprint   { color:#7c3aed; background:rgba(124,58,237,.1); border-color:rgba(124,58,237,.3); }
.run-tag-mid      { color:#2563eb; background:rgba(37,99,235,.1);  border-color:rgba(37,99,235,.3); }
.run-tag-long     { color:#059669; background:rgba(5,150,105,.1);  border-color:rgba(5,150,105,.3); }
.run-tag-marathon { color:#d97706; background:rgba(217,119,6,.1);  border-color:rgba(217,119,6,.3); }
.run-tag-ultra    { color:#dc2626; background:rgba(220,38,38,.1);  border-color:rgba(220,38,38,.3); }
.run-tag-trail    { color:#78350f; background:rgba(120,53,15,.1);  border-color:rgba(120,53,15,.3); }

.run-tag-emoji { font-size: 14px; line-height: 1; }

/* Stats row */
.run-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--border);
}
.stat {
  padding: 13px 18px;
  border-right: 1px solid var(--border);
  text-align: center;
}
.stat:last-child { border-right: none; }

.stat-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
}
.stat-value {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.3px;
}
.stat-sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 1px;
}

/* Photos */
.photos-wrap { margin-top: 18px; }
.photos-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.photos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
}
.photo-thumb {
  aspect-ratio: 1;
  border-radius: 10px;
  overflow: hidden;
  background: var(--border);
  cursor: pointer;
}
.photo-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.2s;
}
.photo-thumb:hover img { transform: scale(1.05); }
.no-photos {
  color: var(--muted);
  font-size: 13px;
  font-style: italic;
}

/* ── Personal Bests page ── */
.pb-card {
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
  overflow: hidden;
}

.pb-head {
  background: #1a1a1a;
  color: #fff;
  padding: 22px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.pb-dist-name {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -0.5px;
}
.pb-race {
  flex: 1 1 auto;
  text-align: center;
  font-size: 20px;
  font-weight: 800;
  font-style: normal;
  letter-spacing: -0.4px;
  line-height: 1.1;
  color: rgba(255,255,255,0.75);
  padding: 0 14px;
  min-width: 0;
}
.pb-time {
  font-size: 34px;
  font-weight: 900;
  color: var(--accent);
  letter-spacing: -1.5px;
}
.pb-prog {
  font-size: 13px;
  font-weight: 700;
  color: #1a7a3a;
  background: #e8f8ee;
  border-radius: 20px;
  padding: 3px 10px;
  white-space: nowrap;
}
:root.dark .pb-prog { color: #6dba6d; background: rgba(45,106,45,.15); }

.pb-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--border);
}
.pb-stat {
  padding: 14px 20px;
  border-right: 1px solid var(--border);
}
.pb-stat:last-child { border-right: none; }

.pb-photos { padding: 16px 24px; border-bottom: 1px solid var(--border); }

/* History */
.pb-history { padding: 16px 24px; }
.history-head {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.history-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.history-row:last-child { border-bottom: none; }
.history-time {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.5px;
  min-width: 70px;
}
.history-date { color: var(--muted); }
.history-loc { margin-left: auto; color: var(--muted); font-size: 13px; }

/* ── Lightbox ── */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.93);
  z-index: 999;
  align-items: center;
  justify-content: center;
}
#lightbox.open { display: flex; }
#lightbox img {
  max-width: 92vw;
  max-height: 92vh;
  object-fit: contain;
  border-radius: 10px;
}
#lb-close {
  position: fixed;
  top: 18px; right: 22px;
  background: none; border: none;
  color: rgba(255,255,255,0.75);
  font-size: 38px; line-height: 1;
  cursor: pointer;
  transition: color 0.1s;
}
#lb-close:hover { color: #fff; }
#lb-prev, #lb-next {
  position: fixed;
  top: 50%; transform: translateY(-50%);
  background: none; border: none;
  color: rgba(255,255,255,0.7);
  font-size: 64px; line-height: 1;
  cursor: pointer;
  padding: 0 18px;
  transition: color 0.1s;
  user-select: none;
}
#lb-prev { left: 0; }
#lb-next { right: 0; }
#lb-prev:hover, #lb-next:hover { color: #fff; }
#lb-prev.hidden, #lb-next.hidden { display: none; }

/* ── Filter bar ── */
.filter-bar {
  max-width: 1180px;
  margin: 24px auto 0;
  padding: 0 24px 4px;
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 10px;
  align-items: center;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-bar::after { content: ''; flex-shrink: 0; width: 24px; }

.filter-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.filter-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

.filter-bar select,
.filter-bar input[type="text"] {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  padding: 5px 10px;
  outline: none;
  transition: border-color 0.15s;
}
.filter-bar select:focus,
.filter-bar input[type="text"]:focus { border-color: var(--accent); }

.filter-bar input[type="text"] { width: 190px; }

#filter-reset {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
#filter-reset:hover { border-color: var(--accent); color: var(--accent); }

#runs-count-bar {
  max-width: 1180px;
  margin: 6px auto 0;
  padding: 0 24px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  min-height: 16px;
}

/* ── Trend chart ── */
.chart-wrap {
  max-width: 1180px;
  margin: 20px auto 0;
  padding: 0 24px;
}

.chart-card {
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 20px 24px 16px;
}

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.chart-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1px;
  color: var(--text);
}

.chart-toggle {
  display: flex;
  gap: 4px;
}

.chart-toggle button {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 11px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.15s;
}
.chart-toggle button:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
.chart-toggle button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.chart-svg { width: 100%; display: block; overflow: visible; }

/* ── Activities tab ── */
.act-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 20px;
}

.chart-toggle-row {
  display: flex;
  justify-content: flex-end;
  padding: 6px 12px 0;
}
.chart-toggle-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: var(--muted);
  padding: 2px 6px;
  line-height: 1;
  transition: color 0.15s;
}
.chart-toggle-btn:hover { color: var(--text); }

.cmp-card { padding-bottom: 8px; }
.cmp-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 20px 10px;
}
.cmp-title-lbl {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  margin-right: 4px;
}
.cmp-head-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}
.cmp-custom-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.cmp-legend {
  display: flex;
  gap: 18px;
  padding: 0 20px 10px;
  flex-wrap: wrap;
}
.cmp-leg-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.cmp-leg-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.act-search-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.act-search-bar input[type="search"] {
  flex: 0 0 220px;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.act-search-bar input[type="search"]:focus {
  border-color: var(--accent);
}
.act-year-jumps {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.act-year-btn {
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--card);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.act-year-btn:hover { border-color: var(--accent); color: var(--accent); }
.act-year-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.act-summary {
  background: var(--card);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 14px 22px;
  margin-bottom: 20px;
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
}
.act-sum-item { display: flex; flex-direction: column; }
.act-sum-val {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.5px;
  color: var(--accent);
  line-height: 1.1;
}
.act-sum-lbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 2px;
}

.act-row {
  background: var(--card);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 12px 20px;
  margin-bottom: 8px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 18px;
  font-size: 14px;
}

.act-type {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 2px 9px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--muted);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.act-type.trail { background: #edf7ed; color: #1e5c1e; border-color: #a5c8a5; }
:root.dark .act-type.trail { background: rgba(45,106,45,.15); color: #6dba6d; border-color: rgba(45,106,45,.4); }

.act-stat { display: flex; flex-direction: column; }
.act-stat-val {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.3px;
  line-height: 1.1;
}
.act-stat-lbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 2px;
}

/* ── Overview tab ── */
#page-overview { max-width: none; padding: 0 0 56px; }

.ov-hero { position: relative; height: 480px; background: #1a1a1a; overflow: hidden; }
.ov-hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 42%; }
.ov-hero-grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,18,16,.4) 0%, rgba(20,18,16,0) 30%, rgba(20,18,16,.55) 70%, rgba(20,18,16,.92) 100%); }
.ov-hero-inner { position: relative; max-width: 940px; margin: 0 auto; height: 100%; }
.ov-eyebrow { position: absolute; left: 40px; top: 40px; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.85); }
.ov-headline { position: absolute; left: 40px; right: 40px; bottom: 128px; font-size: 54px; font-weight: 900; letter-spacing: -2px; line-height: 1; color: #fff; max-width: 680px; }
.ov-statrow { position: absolute; left: 40px; right: 40px; bottom: 38px; display: flex; gap: 44px; align-items: flex-end; }
.ov-stat-num { font-size: 34px; font-weight: 900; letter-spacing: -1px; color: #fff; line-height: 1; }
.ov-stat-num small { font-size: 14px; color: rgba(255,255,255,.6); font-weight: 700; letter-spacing: 0; }
.ov-stat-lbl { margin-top: 5px; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.6); }
.ov-explore {
  margin-left: auto;
  font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
  color: #fff; background: var(--accent); border: none; border-radius: 20px;
  padding: 8px 17px; cursor: pointer;
}

.ov-col { max-width: 940px; margin: 0 auto; }
.ov-mem { padding: 34px 40px 20px; }
.ov-mem-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
.ov-mem-title { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.ov-mem-meta { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
.ov-grid { column-count: 3; column-gap: 10px; }
.ov-cell { border-radius: 14px; overflow: hidden; position: relative; cursor: pointer;
  display: block; break-inside: avoid; margin-bottom: 10px; }

.ov-cell img { width: 100%; height: auto; display: block; }
.ov-cap { position: absolute; left: 10px; right: 10px; bottom: 10px; color: #fff; font-size: 13px; font-weight: 800;
  letter-spacing: -.2px; background: rgba(0,0,0,.6); padding: 4px 9px; border-radius: 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-more { background: #1a1a1a; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: #fff; font-size: 15px; font-weight: 800; aspect-ratio: 4 / 3; }
.ov-more small { font-size: 10px; font-weight: 600; color: rgba(255,255,255,.6); letter-spacing: .5px; margin-top: 2px; }

.ov-latest { padding: 14px 40px 0; }
.ov-latest-lbl { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.ov-latest-card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 20px; padding: 18px 24px; }
.ov-latest-medal { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); flex-shrink: 0; cursor: pointer; }
.ov-latest-meta { font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.ov-latest-name { font-size: 20px; font-weight: 800; letter-spacing: -.4px; }
.ov-pb-pill { font-size: 12px; font-weight: 700; color: #1a7a3a; background: #e8f8ee; border-radius: 20px; padding: 5px 12px; white-space: nowrap; flex-shrink: 0; }
:root.dark .ov-pb-pill { color: #6dba6d; background: rgba(45,106,45,.15); }
.ov-latest-right { margin-left: auto; text-align: right; flex-shrink: 0; }
.ov-latest-time { font-size: 32px; font-weight: 900; letter-spacing: -1.4px; color: var(--accent); line-height: 1; }
.ov-latest-sub { margin-top: 4px; font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }

/* ── PB progression chart ── */
.pbp-wrap { padding: 18px 24px 8px; border-bottom: 1px solid var(--border); }
.pbp-label { font-size: 9px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.pbp-bars { display: flex; align-items: flex-end; gap: 12px; padding-top: 18px; }
.pbp-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pbp-bar { width: 100%; max-width: 34px; border-radius: 6px 6px 0 0; position: relative; }
.pbp-bar.old { background: #efe9df; }
.pbp-bar.mid { background: #f6b79c; }
.pbp-bar.pb  { background: var(--accent); }
:root.dark .pbp-bar.old { background: #3a3a3a; }
:root.dark .pbp-bar.mid { background: #8a5a3f; }
.pbp-pblabel { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; color: var(--accent); }
.pbp-year { font-size: 9px; font-weight: 700; color: var(--muted); }
.pbp-year.pb { color: var(--text); font-weight: 800; }

/* ── Burger button (hidden on desktop) ── */
.burger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 36px;
  height: 36px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  margin-left: auto;
  flex-shrink: 0;
}
.burger span {
  display: block;
  height: 2px;
  border-radius: 2px;
  background: rgba(255,255,255,0.8);
  transition: transform 0.22s, opacity 0.22s, width 0.22s;
  transform-origin: center;
}
.burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger.open span:nth-child(2) { opacity: 0; width: 0; }
.burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ── Responsive ── */
@media (max-width: 640px) {
  /* Header: single row, nav hidden behind burger */
  header {
    height: 54px;
    padding: 0 14px;
    gap: 8px;
    position: relative;
  }
  .burger { display: flex; }
  #main-nav {
    display: none;
    position: absolute;
    top: 54px;
    left: 0; right: 0;
    background: #1a1a1a;
    flex-direction: column;
    padding: 8px 12px 14px;
    gap: 4px;
    border-top: 1px solid rgba(255,255,255,0.1);
    z-index: 199;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
  #main-nav.open { display: flex; }
  #main-nav button { width: 100%; text-align: left; padding: 10px 14px; font-size: 15px; border-radius: 10px; }

  /* Pages */
  .page { padding: 16px 12px 48px; }

  /* Run card */
  .rc-strip { height: 150px; }
  .rc-strip img { height: 150px; }
  .rc-strip img.rc-medal { width: 52px; height: 52px; bottom: -20px; right: 14px; }
  .rc-body { padding: 14px 16px 12px; }
  .rc-title { font-size: 18px; }
  .rc-dist { font-size: 26px; }
  .run-stats { grid-template-columns: repeat(2, 1fr); }
  .stat { padding: 10px 12px; }
  .stat-value { font-size: 16px; }

  /* Overview */
  .ov-hero { height: 420px; }
  .ov-eyebrow { left: 16px; top: 20px; }
  .ov-headline { left: 16px; right: 16px; bottom: 158px; font-size: 32px; letter-spacing: -1px; }
  .ov-statrow { left: 16px; right: 16px; bottom: 20px; gap: 18px; flex-wrap: wrap; }
  .ov-stat-num { font-size: 24px; }
  .ov-mem { padding: 24px 12px 12px; }
  .ov-latest { padding: 8px 12px 0; }
  .ov-grid { column-count: 2; column-gap: 8px; }
  .ov-latest-card { flex-wrap: wrap; gap: 12px; padding: 14px 16px; }
  .ov-latest-right { margin-left: 0; text-align: left; width: 100%; }

  /* PB card */
  .pb-head { padding: 16px 18px; flex-wrap: wrap; gap: 4px; }
  .pb-dist-name { font-size: 20px; flex: 1 1 100%; }
  .pb-time { font-size: 28px; }
  .pb-prog { font-size: 12px; padding: 3px 8px; }
  .pb-stats { grid-template-columns: repeat(2, 1fr); }
  .pb-stat { padding: 10px 14px; }
  .pb-photos { padding: 12px 16px; }
  .pb-history { padding: 12px 16px; }
  .history-row { flex-wrap: wrap; gap: 8px; }
  .history-loc { margin-left: 0; }

  /* Filter bar */
  .filter-bar { padding: 0 12px; margin-top: 14px; gap: 8px; }
  .filter-bar select,
  .filter-bar input[type="text"] { font-size: 13px; max-width: 120px; }
  #filter-trail { max-width: none; }

  /* Chart */
  .chart-wrap { padding: 0 12px; }
  .chart-card { padding: 14px 14px 12px; }

  /* Activities */
  .cmp-head { padding: 10px 14px 8px; gap: 8px; }
  .act-summary { padding: 12px 14px; gap: 16px; }
  .act-sum-val { font-size: 18px; }
  .act-row { padding: 10px 14px; gap: 10px; font-size: 13px; }
  .act-search-bar input[type="search"] { flex: 1 1 100%; }

  /* Photos grid: 2 columns on small screens */
  .photos-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
}
</style>
</head>
<body>

<header>
  <div class="logo" id="logo">Sergey's <em>Running</em> Log</div>
  <nav id="main-nav">
    <button class="active" id="nav-overview">Overview</button>
    <button id="nav-runs">All Runs</button>
    <button id="nav-pbs">Personal Bests</button>
    <button id="nav-activities">Activities</button>
  </nav>
  <button id="theme-toggle" title="Toggle dark/light mode">☀</button>
  <div class="lang-switch">
    <button id="lang-en" class="active">EN</button>
    <button id="lang-be">BE</button>
  </div>
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<main>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close">×</button>
  <button id="lb-prev">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next">&#8250;</button>
</div>

<div id="page-overview" class="page visible"></div>

<div id="runs-filterbar" class="filter-bar" style="display:none">
  <div class="filter-group">
    <label class="filter-label" for="filter-year" id="flabel-year"></label>
    <select id="filter-year"></select>
  </div>

  <div class="filter-group">
    <label class="filter-label" for="filter-distance" id="flabel-distance"></label>
    <select id="filter-distance"></select>
    <input type="number" id="filter-dist-custom" min="0" step="0.01"
      style="display:none;width:80px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;padding:5px 8px;outline:none"
      placeholder="km">
  </div>
  <div class="filter-group">
    <label class="filter-label" for="filter-search" id="flabel-search"></label>
    <input type="text" id="filter-search" placeholder="…">
  </div>
  <div class="filter-group">
    <label class="filter-label" for="filter-race" id="flabel-race"></label>
    <input type="text" id="filter-race" placeholder="…">
  </div>
  <div class="filter-group">
    <label class="filter-label" for="filter-trail" id="flabel-trail"></label>
    <select id="filter-trail" style="min-width:95px"></select>
  </div>
  <button id="filter-reset"></button>
</div>
<div id="runs-count-bar" style="display:none"></div>

<div id="page-runs" class="page"></div>

<div id="pbs-chart" class="chart-wrap" style="display:none">
  <div class="chart-card">
    <div class="chart-header">
      <div class="filter-group">
        <label class="filter-label" for="pbc-distance" id="pbc-label-dist"></label>
        <select id="pbc-distance"></select>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="chart-toggle">
          <button class="active" id="pbc-pace"></button>
          <button id="pbc-time"></button>
        </div>
        <button id="pbc-toggle">▾</button>
      </div>
    </div>
    <svg class="chart-svg" id="pbc-svg" viewBox="0 0 760 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  </div>
</div>

<div id="page-pbs" class="page"></div>

<div id="page-activities" class="page">
  <div class="chart-card" style="margin-bottom:20px">
    <div class="cmp-head">
      <button class="chart-toggle-btn" id="act-chart-toggle">▾</button>
      <div class="act-controls">
        <div class="filter-group">
          <label class="filter-label" for="act-type" id="actl-type"></label>
          <select id="act-type"></select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="act-metric" id="actl-metric"></label>
          <select id="act-metric">
            <option value="distance" id="aom-distance"></option>
            <option value="runs"     id="aom-runs"></option>
            <option value="time"     id="aom-time"></option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="act-period" id="actl-period"></label>
          <select id="act-period">
            <option value="week"       id="aop-week"></option>
            <option value="curr_month" id="aop-curr_month"></option>
            <option value="last_month" id="aop-last_month"></option>
            <option value="curr_year"  id="aop-curr_year"></option>
            <option value="last_year"  id="aop-last_year"></option>
            <option value="custom"     id="aop-custom"></option>
            <option value="all"        id="aop-all"></option>
          </select>
        </div>
        <div id="act-custom-wrap" class="filter-group" style="display:none">
          <input type="date" id="act-from"
            style="border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;padding:5px 10px;outline:none">
          <span style="color:var(--muted);padding:0 4px">–</span>
          <input type="date" id="act-to"
            style="border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;padding:5px 10px;outline:none">
        </div>
      </div>
    </div>
    <div id="act-chart-body">
      <svg class="chart-svg" id="act-svg" viewBox="0 0 760 160"
           xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    </div>
  </div>

  <div class="chart-card cmp-card" style="margin-bottom:20px">
    <div class="cmp-head">
      <button class="chart-toggle-btn" id="cmp-chart-toggle">▾</button>
      <span class="cmp-title-lbl" id="cmpl-title"></span>
      <div class="cmp-head-controls">
        <label class="filter-label" for="cmp-period" id="cmpl-period"></label>
        <select id="cmp-period">
          <option value="week"   id="cop-week"></option>
          <option value="month"  id="cop-month"></option>
          <option value="year"   id="cop-year"></option>
          <option value="custom" id="cop-custom"></option>
        </select>
      </div>
      <div id="cmp-custom-wrap" style="display:none" class="cmp-custom-wrap">
        <span class="filter-label" id="cmpl-p1"></span>
        <input type="date" id="cmp-p1-from"
          style="border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;padding:5px 10px;outline:none">
        <span style="color:var(--muted)">–</span>
        <input type="date" id="cmp-p1-to"
          style="border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;padding:5px 10px;outline:none">
        <span class="filter-label" id="cmpl-p2"></span>
        <input type="date" id="cmp-p2-from"
          style="border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;padding:5px 10px;outline:none">
        <span style="color:var(--muted)">–</span>
        <input type="date" id="cmp-p2-to"
          style="border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;padding:5px 10px;outline:none">
      </div>
    </div>
    <div id="cmp-chart-body">
      <div id="cmp-legend" class="cmp-legend"></div>
      <svg class="chart-svg" id="cmp-svg" viewBox="0 0 760 160"
           xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    </div>
  </div>

  <div class="act-search-bar">
    <input type="search" id="act-search" placeholder="" autocomplete="off">
    <div id="act-year-jumps" class="act-year-jumps"></div>
  </div>

  <div id="act-list"></div>
</div>

</main>

<script src="data/data.js"></script>
<script src="data/activities.js"></script>
<script src="data/photo-dims.js"></script>
<script src="app.js"></script>
</body>
</html>
