# Runs every test suite on each push to main and on pull requests, on Windows with a
# working Tk and ImageMagick, so the GUI checks and the close-during-previews check
# really run: --require-gui makes a skipped GUI check fail the run instead of passing.
# The suites are run with Python directly (tests/run_all.py), never through the .bat
# launchers, whose `pause` would wait for a key press.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # The runner pipes output as cp1252, which has no Cyrillic; Python in UTF-8 mode
      # writes and reads UTF-8 instead.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ImageMagick
        shell: pwsh
        run: |
          choco install imagemagick --no-progress -y
          $dir = Get-ChildItem "C:\Program Files" -Directory -Filter "ImageMagick-*" | Select-Object -First 1
          if (-not $dir) { throw "ImageMagick was not installed" }
          $dir.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run all test suites (GUI checks required)
        run: python -B tests/run_all.py --require-gui
